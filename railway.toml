# Servidor en Railway (el cliente va en Vercel). Usa server/Dockerfile con la
# raíz del repositorio como contexto; solo se redespliega si cambia server/.
[build]
builder = "DOCKERFILE"
dockerfilePath = "server/Dockerfile"
watchPatterns = ["server/**", "railway.toml", ".dockerignore"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Una sola réplica: las salas en juego viven en la memoria del proceso
numReplicas = 1
